<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript DOM Image Slider</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Image Slider</h1>

        <img
            id="slider"
            src="image1.jpg"
            alt="Slider Image">

        <div class="buttons">

            <button onclick="previousImage()">
                Previous
            </button>

            <button onclick="nextImage()">
                Next
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
